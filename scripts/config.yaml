# =============================================================================
# LigandMPNN Pipeline Configuration
# =============================================================================

# --- Environment ---
conda_profile: "/home/tedeschg/miniforge3/etc/profile.d/conda.sh"
project_root: "/home/tedeschg/prj/protein-perturbation"
lmpnn_path: "/software/lmpnn/LigandMPNN"
env_dockndesign: "base"
env_ligandmpnn: "ligandmpnn_env"
output_dir: "/home/tedeschg/prj/protein-perturbation/experiments/dude-z_experiments/CSF1R/reference/output_reference_lmpnn"

# --- Residue selection (docking‑box based) ---
residues_selection:
  # Path to the reference complex (PDB) that contains the ligand
  reference_complex: "/home/tedeschg/prj/protein-perturbation/data/dude-z_dataset/complexes/CSF1R/reference/csf1r_crystal.pdb"
  # Docking box padding (Å), same as used in GNINA
  autobox_add: 8.0
  # Output file name (inside each PDB's subdirectory)
  output_file: "selected_residues.txt"
  # Format: list, space_separated, or json
  output_format: "space_separated"
  # Include HETATM residues (e.g. waters, other ligands) in the selection?
  include_hetatm_residues: false

# --- Pose QC ---
pose_qc:
  enabled: true
  clash_dist: 1.5
  bond_length_tol: 0.0
  strict: false
  out_json: true
  on_clash: "warn"

# --- LigandMPNN ---
ligandmpnn:
  model_type: "ligand_mpnn"
  checkpoint: "model_params/ligandmpnn_v_32_010_25.pt"
  temperature: 0.1
  seed: 42
  number_of_batches: 1
